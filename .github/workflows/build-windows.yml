name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows executable
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Check Python source and imports
        run: |
          python -m py_compile lottery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import lottery; import openpyxl; print('Imports OK')"

      - name: Test allocation and safe saving
        run: python -m unittest -v test_lottery.py

      - name: Build standalone EXE
        run: >-
          python -m PyInstaller
          --clean
          --noconfirm
          --onefile
          --console
          --name university-lottery
          --add-data "lottery.html;."
          lottery.py

      - name: Check packaged program starts
        run: |
          & .\dist\university-lottery.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/smoke_packaged.py dist/university-lottery.exe

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: university-lottery-windows-x64
          path: dist/university-lottery.exe
          if-no-files-found: error
          retention-days: 30
